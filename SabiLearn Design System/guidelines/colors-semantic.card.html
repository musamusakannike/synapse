<!-- @dsCard group="Colors" viewport="700x150" subtitle="Success, warning, error, info" name="Semantic colors" -->
<link rel="stylesheet" href="../styles.css"><div style="display:flex;gap:12px;height:100%;padding:12px;font-family:var(--font-body);box-sizing:border-box">
<div style="flex:1;background:var(--color-success-soft);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px"><div style="width:28px;height:28px;border-radius:50%;background:var(--color-success)"></div><span style="font-size:12px;color:var(--neutral-700)">Success</span></div>
<div style="flex:1;background:var(--color-warning-soft);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px"><div style="width:28px;height:28px;border-radius:50%;background:var(--color-warning)"></div><span style="font-size:12px;color:var(--neutral-700)">Warning</span></div>
<div style="flex:1;background:var(--color-error-soft);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px"><div style="width:28px;height:28px;border-radius:50%;background:var(--color-error)"></div><span style="font-size:12px;color:var(--neutral-700)">Error</span></div>
<div style="flex:1;background:var(--color-info-soft);border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px"><div style="width:28px;height:28px;border-radius:50%;background:var(--color-info)"></div><span style="font-size:12px;color:var(--neutral-700)">Info</span></div>
</div>
