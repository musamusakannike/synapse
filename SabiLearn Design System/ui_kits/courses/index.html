<!DOCTYPE html><html><head><meta charset="utf-8"><title>SabiLearn — Courses</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="../../assets/image-slot.js"></script>
</head><body style="margin:0;background:var(--surface-page);min-height:100vh">
<div id="root"></div>
<script type="text/babel" src="CatalogScreen.jsx"></script>
<script type="text/babel" src="CourseDetailScreen.jsx"></script>
<script type="text/babel" src="LessonPlayerScreen.jsx"></script>
<script type="text/babel">
function App(){
const [screen,setScreen]=React.useState('catalog');
const [course,setCourse]=React.useState(null);
const [lesson,setLesson]=React.useState(null);
React.useEffect(()=>{window.lucide&&window.lucide.createIcons()});
if(screen==='detail')return <CourseDetailScreen course={course} onBack={()=>setScreen('catalog')} onOpenLesson={(l)=>{setLesson(l);setScreen('lesson');}} />;
if(screen==='lesson')return <LessonPlayerScreen lesson={lesson} onBack={()=>setScreen('detail')} onComplete={()=>setScreen('detail')} />;
return <CatalogScreen onOpenCourse={(c)=>{setCourse(c);setScreen('detail');}} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
