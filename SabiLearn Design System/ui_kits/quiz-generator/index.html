<!DOCTYPE html><html><head><meta charset="utf-8"><title>SabiLearn — Quiz Generator</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head><body style="margin:0;background:var(--surface-page);min-height:100vh">
<div id="root"></div>
<script type="text/babel" src="UploadScreen.jsx"></script>
<script type="text/babel" src="QuizScreen.jsx"></script>
<script type="text/babel" src="ResultsScreen.jsx"></script>
<script type="text/babel">
function App(){
const [screen,setScreen]=React.useState('upload');
React.useEffect(()=>{window.lucide&&window.lucide.createIcons()});
if(screen==='quiz')return <QuizScreen onFinish={()=>setScreen('results')} />;
if(screen==='results')return <ResultsScreen onRestart={()=>setScreen('upload')} />;
return <UploadScreen onGenerate={()=>setScreen('quiz')} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
