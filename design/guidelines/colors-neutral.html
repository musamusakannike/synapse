<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-body)">
<div style="flex:1;background:var(--ink-900);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">ink-900</div>
<div style="flex:1;background:var(--ink-700);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">ink-700</div>
<div style="flex:1;background:var(--ink-500);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff">ink-500</div>
<div style="flex:1;background:var(--ink-300);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-900)">ink-300</div>
<div style="flex:1;background:var(--surface-page);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-900);border:1px solid var(--line)">page</div>
<div style="flex:1;background:var(--surface-sunken);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--ink-900)">sunken</div>
