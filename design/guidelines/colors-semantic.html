<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-body)">
<div style="flex:1;background:var(--success-100);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--success)">success-100</div>
<div style="flex:1;background:var(--success);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff;font-weight:600">success</div>
<div style="flex:1;background:var(--warning-100);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--warning)">warning-100</div>
<div style="flex:1;background:var(--warning);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff;font-weight:600">warning</div>
<div style="flex:1;background:var(--danger-100);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:var(--danger)">danger-100</div>
<div style="flex:1;background:var(--danger);display:flex;align-items:flex-end;padding:10px;font-size:12px;color:#fff;font-weight:600">danger</div>
</div>
