<!-- @dsCard group="Spacing" viewport="700x160" name="Radius & Shadow" subtitle="Soft rounded, layered elevation" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);display:flex;gap:16px;height:160px;padding:20px;box-sizing:border-box;background:var(--surface-page);align-items:center">
<div style="width:90px;height:90px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-500)">md/xs</div>
<div style="width:90px;height:90px;background:var(--surface-card);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-500)">xl/md</div>
<div style="width:90px;height:90px;background:var(--surface-card);border-radius:var(--radius-2xl);box-shadow:var(--shadow-xl);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-500)">2xl/xl</div>
<div style="width:90px;height:90px;background:var(--ink-900);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff">full</div>
</div>
