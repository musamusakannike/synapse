<!-- @dsCard group="Spacing" viewport="700x160" name="Scale" subtitle="4px base rhythm" -->
<link rel="stylesheet" href="../styles.css">
<div style="font-family:var(--font-body);display:flex;align-items:flex-end;gap:10px;height:160px;padding:20px;box-sizing:border-box;background:var(--surface-card)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-2);height:var(--space-2);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">2</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-4);height:var(--space-4);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">4</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-6);height:var(--space-6);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">6</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-8);height:var(--space-8);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">8</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-12);height:var(--space-12);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">12</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:var(--space-16);height:var(--space-16);background:var(--brand-gold)"></div><span style="font-size:11px;color:var(--ink-500)">16</span></div>
</div>
